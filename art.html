<dialog id="lightbox" aria-label="Enlarged artwork">
  <button type="button" class="lb-close" aria-label="Close">&times;</button>
  <img alt="">
  <p class="lb-cap"></p>
</dialog>

<script>
(function(){
  document.getElementById('yr').textContent = new Date().getFullYear();
  // Discourage casual saving: no right-click menu or dragging on artwork
  document.querySelectorAll('.piece img, #lightbox img').forEach(function(im){
    im.addEventListener('contextmenu',function(e){e.preventDefault()});
    im.addEventListener('dragstart',function(e){e.preventDefault()});
  });
  var lb=document.getElementById('lightbox'); if(!lb||!lb.showModal) return;
  var big=lb.querySelector('img'), cap=lb.querySelector('.lb-cap');
  document.querySelectorAll('.piece img').forEach(function(im){
    im.style.cursor='zoom-in';
    im.addEventListener('click',function(){
      big.src=im.currentSrc||im.src; big.alt=im.alt;
      var fc=im.parentNode.querySelector('figcaption'); cap.textContent=fc?fc.textContent.replace(/\s+/g,' ').trim():'';
      lb.showModal();
    });
  });
  lb.addEventListener('click',function(e){ if(e.target===lb||e.target.classList.contains('lb-close')) lb.close(); });
})();
</script>
