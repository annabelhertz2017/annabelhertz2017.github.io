<main id="top">

  <section class="art-intro">
    <h1>Art</h1>
    <p class="lede">Paintings and drawings, alongside the writing. New pieces and works in progress appear on Instagram first.</p>
    <p class="actions">
      <a class="btn" href="https://www.instagram.com/ms.annabel.lille.hertz/" target="_blank" rel="noopener">Follow on Instagram</a>
    </p>
  </section>

  <section class="gallery-wrap">
    <div class="gallery">
      <figure class="piece">
        <img src="images/art/coffee.jpg" alt="A woman with dark hair looks down at a steaming pink cup she holds in one hand, painted in warm ochres, teals and blues" width="1416" height="1106" loading="lazy">
      </figure>

      <figure class="piece">
        <img src="images/art/beach-reader.jpg" alt="A woman in a white hat sits on a beach towel with a straw bag, reading a book, with a green sky and dark blue sea behind her" width="698" height="521" loading="lazy">
      </figure>

      <figure class="piece">
        <img src="images/art/star.jpg" alt="An abstract painting of a large star inside a circle, split down the middle and filled with streaks of red, pink, orange, blue and green" width="1056" height="786" loading="lazy">
      </figure>

      <figure class="piece">
        <img src="images/art/fruit-bowl.jpg" alt="A still life of fruit in a wooden bowl, including grapes, oranges, a lemon, apples and a plum, against a purple and blue background" width="1600" height="1201" loading="lazy">
      </figure>

</main>

<footer class="site-footer">
  <p>&copy; <span id="yr">2026</span> Annabel Lille Hertz</p>

    <a href="https://www.goodreads.com/author/show/6469408.Annabel_Lille_Hertz">Goodreads</a> &middot;

<dialog id="lightbox" aria-label="Enlarged artwork">
  <button type="button" class="lb-close" aria-label="Close">&times;</button>
  <img alt="">
  <p class="lb-cap"></p>
</dialog>

<script>
(function(){
  document.getElementById('yr').textContent = new Date().getFullYear();
  var lb=document.getElementById('lightbox'); if(!lb||!lb.showModal) return;
  var big=lb.querySelector('img'), cap=lb.querySelector('.lb-cap');
  document.querySelectorAll('.piece img').forEach(function(im){
    im.style.cursor='zoom-in';
    im.addEventListener('click',function(){
      big.src=im.currentSrc||im.src; big.alt=im.alt;
      var fc=im.parentNode.querySelector('figcaption'); cap.textContent=fc?fc.textContent.replace(/\s+/g,' ').trim():'';
      lb.showModal();
    });
  });
  lb.addEventListener('click',function(e){ if(e.target===lb||e.target.classList.contains('lb-close')) lb.close(); });
})();
</script>
</body>
</html>
